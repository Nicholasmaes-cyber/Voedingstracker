<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Voedingstracker" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.png" />
  <title>Voedingstracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; }
    input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 99px; background: #334155; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; margin-top: -6px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    // ── helpers ──────────────────────────────────────────────────────────────
    const today = () => new Date().toISOString().slice(0, 10);
    const round1 = v => Math.round((v || 0) * 10) / 10;
    const pct = (v, g) => Math.min(100, Math.round((v / g) * 100));

    const DEFAULT_GOALS = { kcal: 2000, protein: 150, fat: 70, carbs: 200 };

    const MACRO_COLORS = {
      kcal: "#f97316", protein: "#3b82f6", fat: "#eab308", carbs: "#22c55e"
    };

    const VITAMIN_NAMES = {
      vitA:"Vit. A", vitC:"Vit. C", vitD:"Vit. D", vitE:"Vit. E", vitK:"Vit. K",
      vitB1:"B1", vitB2:"B2", vitB6:"B6", vitB12:"B12",
      folate:"Folaat", calcium:"Calcium", iron:"IJzer", magnesium:"Magnesium",
      zinc:"Zink", potassium:"Kalium", sodium:"Natrium", fiber:"Vezels"
    };

    // ── localStorage storage ─────────────────────────────────────────────────
    function load(key, def) {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
      catch { return def; }
    }
    function save(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
    }

    // ── Anthropic vision call ─────────────────────────────────────────────────
    async function analyzeLabel(base64, mimeType) {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          messages: [{
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: mimeType, data: base64 } },
              { type: "text", text: `Je bent een voedingswaarde-scanner. Lees de voedingswaardesticker en geef ALLEEN een JSON-object terug (geen markdown, geen tekst errond) met deze velden per 100g:
{
  "name": "productnaam (indien zichtbaar, anders 'Onbekend product')",
  "kcal": getal,
  "protein": getal,
  "fat": getal,
  "carbs": getal,
  "sugar": getal of null,
  "saturatedFat": getal of null,
  "fiber": getal of null,
  "salt": getal of null,
  "vitA": getal of null, "vitC": getal of null, "vitD": getal of null,
  "vitE": getal of null, "vitK": getal of null, "vitB1": getal of null,
  "vitB2": getal of null, "vitB6": getal of null, "vitB12": getal of null,
  "folate": getal of null, "calcium": getal of null, "iron": getal of null,
  "magnesium": getal of null, "zinc": getal of null, "potassium": getal of null, "sodium": getal of null
}
Alle getallen zijn per 100g. Gebruik null als een waarde niet zichtbaar is.` }
            ]
          }]
        })
      });
      const data = await res.json();
      const text = data.content?.find(b => b.type === "text")?.text || "";
      const clean = text.replace(/```json|```/g, "").trim();
      return JSON.parse(clean);
    }

    // ── helpers ───────────────────────────────────────────────────────────────
    function findProduct(products, query) {
      const q = query.toLowerCase();
      return products.find(p => p.name.toLowerCase().includes(q) || q.includes(p.name.toLowerCase()));
    }

    function parseEntry(text) {
      const m = text.match(/(\d+(?:[.,]\d+)?)\s*(?:gr?|gram|g)\s+(.+)/i)
        || text.match(/(.+?)\s+(\d+(?:[.,]\d+)?)\s*(?:gr?|gram|g)/i);
      if (!m) return null;
      const isFirst = /^\d/.test(text);
      const grams = parseFloat((isFirst ? m[1] : m[2]).replace(",", "."));
      const name = (isFirst ? m[2] : m[1]).trim();
      return { grams, name };
    }

    function computeNutrition(product, grams) {
      const f = grams / 100;
      const result = { grams, productId: product.id, productName: product.name };
      ["kcal","protein","fat","carbs","sugar","saturatedFat","fiber","salt",
       "vitA","vitC","vitD","vitE","vitK","vitB1","vitB2","vitB6","vitB12",
       "folate","calcium","iron","magnesium","zinc","potassium","sodium"
      ].forEach(k => { result[k] = product[k] != null ? round1(product[k] * f) : null; });
      return result;
    }

    function sumEntries(entries) {
      const keys = ["kcal","protein","fat","carbs","sugar","saturatedFat","fiber","salt",
        "vitA","vitC","vitD","vitE","vitK","vitB1","vitB2","vitB6","vitB12",
        "folate","calcium","iron","magnesium","zinc","potassium","sodium"];
      const sum = {};
      keys.forEach(k => { sum[k] = round1(entries.reduce((a, e) => a + (e[k] || 0), 0)); });
      return sum;
    }

    // ── MacroBar ──────────────────────────────────────────────────────────────
    function MacroBar({ label, value, goal, color }) {
      const p = pct(value, goal);
      return (
        <div style={{ marginBottom: 10 }}>
          <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, marginBottom:3 }}>
            <span style={{ fontWeight:600, color }}>{label}</span>
            <span style={{ color:"#94a3b8" }}>{value} / {goal}{label==="Kcal"?"":""}</span>
          </div>
          <div style={{ background:"#1e293b", borderRadius:99, height:8, overflow:"hidden" }}>
            <div style={{ width:`${p}%`, background:color, height:"100%", borderRadius:99, transition:"width .4s" }} />
          </div>
        </div>
      );
    }

    // ── ScanModal ─────────────────────────────────────────────────────────────
    function ScanModal({ onClose, onSaved, prefillName }) {
      const [step, setStep] = useState("upload");
      const [img, setImg] = useState(null);
      const [imgMime, setImgMime] = useState(null);
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [err, setErr] = useState(null);
      const [name, setName] = useState(prefillName || "");
      const fileRef = useRef();
      const camRef = useRef();

      const handleFile = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          const src = ev.target.result;
          setImg(src.split(",")[1]);
          setImgMime(file.type || "image/jpeg");
          setStep("preview");
        };
        reader.readAsDataURL(file);
      };

      const analyze = async () => {
        setLoading(true); setErr(null);
        try {
          const r = await analyzeLabel(img, imgMime);
          setResult(r);
          setName(r.name !== "Onbekend product" ? r.name : (prefillName || ""));
          setStep("result");
        } catch(e) { setErr("Kon sticker niet lezen. Probeer een duidelijkere foto."); }
        finally { setLoading(false); }
      };

      const saveProd = () => {
        if (!name.trim()) return;
        const product = { ...result, name: name.trim(), id: Date.now().toString() };
        onSaved(product);
      };

      const overlay = { position:"fixed", inset:0, background:"rgba(0,0,0,.75)", zIndex:100, display:"flex", alignItems:"center", justifyContent:"center", padding:16 };
      const box = { background:"#1e293b", borderRadius:16, padding:24, width:"100%", maxWidth:440, maxHeight:"90vh", overflowY:"auto" };

      return (
        <div style={overlay} onClick={e => e.target===e.currentTarget && onClose()}>
          <div style={box}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 }}>
              <h2 style={{ margin:0, fontSize:18 }}>📷 Scan voedingssticker</h2>
              <button onClick={onClose} style={{ background:"none", border:"none", color:"#94a3b8", fontSize:22, cursor:"pointer" }}>×</button>
            </div>

            {step === "upload" && (
              <div style={{ textAlign:"center" }}>
                <p style={{ color:"#94a3b8", marginBottom:24 }}>Maak een foto van de voedingswaardesticker of upload een bestaande foto.</p>
                <div style={{ display:"flex", gap:12, justifyContent:"center" }}>
                  <button onClick={() => fileRef.current.click()} style={btnStyle("#3b82f6")}>📁 Bestand</button>
                  <button onClick={() => camRef.current.click()} style={btnStyle("#6366f1")}>📷 Camera</button>
                </div>
                <input ref={fileRef} type="file" accept="image/*" style={{ display:"none" }} onChange={handleFile} />
                <input ref={camRef} type="file" accept="image/*" capture="environment" style={{ display:"none" }} onChange={handleFile} />
              </div>
            )}

            {step === "preview" && (
              <div style={{ textAlign:"center" }}>
                <img src={`data:${imgMime};base64,${img}`} style={{ maxWidth:"100%", borderRadius:8, marginBottom:16 }} alt="preview" />
                {err && <p style={{ color:"#ef4444" }}>{err}</p>}
                <div style={{ display:"flex", gap:12, justifyContent:"center" }}>
                  <button onClick={() => { setStep("upload"); setImg(null); setErr(null); }} style={btnStyle("#475569")}>Opnieuw</button>
                  <button onClick={analyze} disabled={loading} style={btnStyle("#f97316")}>{loading ? "Analyseren…" : "🔍 Analyseer"}</button>
                </div>
              </div>
            )}

            {step === "result" && result && (
              <div>
                <div style={{ background:"#0f172a", borderRadius:10, padding:16, marginBottom:16 }}>
                  <p style={{ margin:"0 0 8px", color:"#94a3b8", fontSize:12 }}>Per 100g</p>
                  {[["Calorieën","kcal","kcal"],["Proteïnen","protein","g"],["Vetten","fat","g"],["Koolhydraten","carbs","g"]].map(([l,k,u]) => (
                    <div key={k} style={{ display:"flex", justifyContent:"space-between", padding:"4px 0", borderBottom:"1px solid #1e293b" }}>
                      <span style={{ color:"#e2e8f0" }}>{l}</span>
                      <span style={{ fontWeight:700, color: MACRO_COLORS[k] }}>{result[k]} {u}</span>
                    </div>
                  ))}
                  {Object.entries(VITAMIN_NAMES).filter(([k]) => result[k] != null).map(([k,l]) => (
                    <div key={k} style={{ display:"flex", justifyContent:"space-between", padding:"3px 0", borderBottom:"1px solid #1e293b", fontSize:13 }}>
                      <span style={{ color:"#94a3b8" }}>{l}</span>
                      <span style={{ color:"#cbd5e1" }}>{result[k]}g</span>
                    </div>
                  ))}
                </div>
                <label style={{ display:"block", marginBottom:6, fontSize:13, color:"#94a3b8" }}>Productnaam</label>
                <input value={name} onChange={e => setName(e.target.value)} placeholder="Geef een naam…"
                  style={{ width:"100%", padding:"10px 12px", borderRadius:8, border:"1px solid #334155", background:"#0f172a", color:"#e2e8f0", fontSize:15, boxSizing:"border-box", marginBottom:16 }} />
                <button onClick={saveProd} disabled={!name.trim()} style={{ ...btnStyle("#22c55e"), width:"100%" }}>💾 Opslaan in bibliotheek</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    const btnStyle = (bg, extra={}) => ({
      background: bg, color: "#fff", border: "none", borderRadius: 8,
      padding: "10px 18px", fontWeight: 600, fontSize: 14, cursor: "pointer", ...extra
    });

    // ── Dashboard ─────────────────────────────────────────────────────────────
    function Dashboard({ goals, totals, entries, onQuickAdd, onScan, onRemove }) {
      const [quickText, setQuickText] = useState("");
      const [quickMsg, setQuickMsg] = useState(null);

      const handleAdd = () => {
        onQuickAdd(quickText.trim(), msg => {
          setQuickMsg(msg);
          if (msg.type === "ok") { setQuickText(""); setTimeout(() => setQuickMsg(null), 2500); }
          else setTimeout(() => setQuickMsg(null), 3500);
        });
      };

      return (
        <div>
          <h3 style={{ margin:"0 0 16px", fontSize:16 }}>Vandaag</h3>
          <div style={{ background:"#1e293b", borderRadius:12, padding:16, marginBottom:16 }}>
            <MacroBar label="Kcal" value={totals.kcal||0} goal={goals.kcal} color={MACRO_COLORS.kcal} />
            <MacroBar label="Proteïnen" value={totals.protein||0} goal={goals.protein} color={MACRO_COLORS.protein} />
            <MacroBar label="Vetten" value={totals.fat||0} goal={goals.fat} color={MACRO_COLORS.fat} />
            <MacroBar label="Koolhydraten" value={totals.carbs||0} goal={goals.carbs} color={MACRO_COLORS.carbs} />
          </div>

          <div style={{ background:"#1e293b", borderRadius:12, padding:16, marginBottom:16 }}>
            <p style={{ margin:"0 0 10px", fontWeight:600, fontSize:14 }}>⚡ Snel toevoegen</p>
            <div style={{ display:"flex", gap:8 }}>
              <input value={quickText} onChange={e => setQuickText(e.target.value)}
                onKeyDown={e => e.key==="Enter" && handleAdd()}
                placeholder="bv. 200 gram kipfilet"
                style={{ flex:1, padding:"10px 12px", borderRadius:8, border:"1px solid #334155", background:"#0f172a", color:"#e2e8f0", fontSize:14 }} />
              <button onClick={handleAdd} style={btnStyle("#f97316")}>+</button>
              <button onClick={onScan} style={btnStyle("#6366f1")}>📷</button>
            </div>
            {quickMsg && (
              <p style={{ margin:"8px 0 0", fontSize:13, color: quickMsg.type==="ok"?"#22c55e":quickMsg.type==="warn"?"#f59e0b":"#ef4444" }}>{quickMsg.text}</p>
            )}
          </div>

          {entries.length > 0 ? (
            <div style={{ background:"#1e293b", borderRadius:12, padding:16 }}>
              <p style={{ margin:"0 0 12px", fontWeight:600, fontSize:14 }}>Maaltijden vandaag</p>
              {entries.map((e, i) => (
                <div key={i} style={{ display:"flex", alignItems:"center", padding:"8px 0", borderBottom:"1px solid #0f172a" }}>
                  <div style={{ flex:1 }}>
                    <span style={{ fontWeight:600, fontSize:14 }}>{e.productName}</span>
                    <span style={{ color:"#64748b", fontSize:13 }}> — {e.grams}g</span>
                    <div style={{ fontSize:12, color:"#94a3b8", marginTop:2 }}>
                      {e.kcal} kcal · {e.protein}g eiwit · {e.fat}g vet · {e.carbs}g kh
                    </div>
                  </div>
                  <button onClick={() => onRemove(i)} style={{ background:"none", border:"none", color:"#ef4444", cursor:"pointer", fontSize:18 }}>×</button>
                </div>
              ))}
            </div>
          ) : (
            <div style={{ textAlign:"center", color:"#475569", marginTop:40 }}>
              <div style={{ fontSize:40 }}>🍽️</div>
              <p style={{ marginTop:12 }}>Nog niets gelogd vandaag.<br/>Typ iets in het veld hierboven!</p>
            </div>
          )}
        </div>
      );
    }

    // ── WeekView ──────────────────────────────────────────────────────────────
    function WeekView({ logs, goals }) {
      const days = Array.from({ length: 7 }, (_, i) => {
        const d = new Date(); d.setDate(d.getDate() - (6 - i));
        return d.toISOString().slice(0, 10);
      });
      const macros = ["kcal","protein","fat","carbs"];
      const vitKeys = Object.keys(VITAMIN_NAMES);
      const dayTotals = days.map(d => ({ date: d, ...sumEntries(logs[d] || []) }));
      const avg = {};
      [...macros, ...vitKeys].forEach(k => {
        avg[k] = round1(dayTotals.reduce((a, d) => a + (d[k] || 0), 0) / 7);
      });
      const goalPct = k => goals[k] ? pct(avg[k], goals[k]) : null;
      const advice = [];
      if (goalPct("kcal") > 110) advice.push({ emoji:"⚠️", text:"Je at gemiddeld meer calorieën dan je doel. Let op je porties." });
      else if (goalPct("kcal") < 80) advice.push({ emoji:"📉", text:"Je at gemiddeld minder calorieën dan je doel." });
      if (goalPct("protein") < 85) advice.push({ emoji:"💪", text:"Je proteïne-inname ligt wat laag. Denk aan vis, eieren, peulvruchten." });
      const lowVits = vitKeys.filter(k => avg[k] != null && avg[k] < 1);
      if (lowVits.length) advice.push({ emoji:"🌿", text:`Lage inname van: ${lowVits.map(k => VITAMIN_NAMES[k]).join(", ")}. Varieer meer.` });
      if (!advice.length) advice.push({ emoji:"✅", text:"Goede week! Je zit goed in balans." });

      return (
        <div>
          <h3 style={{ margin:"0 0 16px", fontSize:16 }}>Weekoverzicht</h3>
          <div style={{ background:"#1e293b", borderRadius:12, padding:16, marginBottom:16 }}>
            <p style={{ margin:"0 0 12px", fontWeight:600, fontSize:14 }}>Calorieën per dag</p>
            {dayTotals.map(d => (
              <div key={d.date} style={{ marginBottom:8 }}>
                <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, marginBottom:3 }}>
                  <span style={{ color:"#94a3b8" }}>{d.date.slice(5)}</span>
                  <span style={{ color:"#f97316" }}>{d.kcal} kcal</span>
                </div>
                <div style={{ background:"#0f172a", borderRadius:99, height:6 }}>
                  <div style={{ width:`${pct(d.kcal, goals.kcal)}%`, background:"#f97316", height:"100%", borderRadius:99 }} />
                </div>
              </div>
            ))}
          </div>
          <div style={{ background:"#1e293b", borderRadius:12, padding:16, marginBottom:16 }}>
            <p style={{ margin:"0 0 12px", fontWeight:600, fontSize:14 }}>Gemiddelde macro's</p>
            {macros.map(k => (
              <div key={k} style={{ display:"flex", justifyContent:"space-between", padding:"5px 0", borderBottom:"1px solid #0f172a", fontSize:13 }}>
                <span style={{ color: MACRO_COLORS[k] }}>{k==="kcal"?"Calorieën":k==="protein"?"Proteïnen":k==="fat"?"Vetten":"Koolhydraten"}</span>
                <span>{avg[k]} {k==="kcal"?"kcal":"g"} <span style={{ color:"#475569" }}>/ {goals[k]}</span></span>
              </div>
            ))}
          </div>
          {vitKeys.some(k => avg[k] > 0) && (
            <div style={{ background:"#1e293b", borderRadius:12, padding:16, marginBottom:16 }}>
              <p style={{ margin:"0 0 12px", fontWeight:600, fontSize:14 }}>Vitamines & mineralen</p>
              {vitKeys.filter(k => avg[k] > 0).map(k => (
                <div key={k} style={{ display:"flex", justifyContent:"space-between", fontSize:13, padding:"3px 0", borderBottom:"1px solid #0f172a" }}>
                  <span style={{ color:"#94a3b8" }}>{VITAMIN_NAMES[k]}</span>
                  <span>{avg[k]}g/dag</span>
                </div>
              ))}
            </div>
          )}
          <div style={{ background:"#1e293b", borderRadius:12, padding:16 }}>
            <p style={{ margin:"0 0 12px", fontWeight:600, fontSize:14 }}>💡 Advies</p>
            {advice.map((a, i) => (
              <div key={i} style={{ display:"flex", gap:10, padding:"8px 0", borderBottom:i<advice.length-1?"1px solid #0f172a":"none" }}>
                <span style={{ fontSize:18 }}>{a.emoji}</span>
                <span style={{ fontSize:13, color:"#cbd5e1", lineHeight:1.5 }}>{a.text}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ── Library ───────────────────────────────────────────────────────────────
    function Library({ products, onScan, onDelete }) {
      const [search, setSearch] = useState("");
      const filtered = products.filter(p => p.name.toLowerCase().includes(search.toLowerCase()));
      return (
        <div>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
            <h3 style={{ margin:0, fontSize:16 }}>Productbibliotheek</h3>
            <button onClick={onScan} style={btnStyle("#6366f1", { fontSize:13 })}>📷 Scan nieuw</button>
          </div>
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Zoek product…"
            style={{ width:"100%", padding:"10px 12px", borderRadius:8, border:"1px solid #334155", background:"#1e293b", color:"#e2e8f0", fontSize:14, marginBottom:16 }} />
          {filtered.length === 0 && <p style={{ textAlign:"center", color:"#475569" }}>Geen producten gevonden.</p>}
          {filtered.map(p => (
            <div key={p.id} style={{ background:"#1e293b", borderRadius:10, padding:"12px 14px", marginBottom:10, display:"flex", alignItems:"flex-start", gap:12 }}>
              <div style={{ flex:1 }}>
                <div style={{ fontWeight:700, marginBottom:4 }}>{p.name}</div>
                <div style={{ fontSize:12, color:"#94a3b8" }}>Per 100g: {p.kcal} kcal · {p.protein}g eiwit · {p.fat}g vet · {p.carbs}g kh</div>
              </div>
              <button onClick={() => onDelete(p.id)} style={{ background:"none", border:"none", color:"#ef4444", cursor:"pointer", fontSize:18, paddingTop:2 }}>×</button>
            </div>
          ))}
        </div>
      );
    }

    // ── Goals ─────────────────────────────────────────────────────────────────
    const KCAL_PER_G = { protein: 4, carbs: 4, fat: 9 };

    function Goals({ goals, onChange }) {
      const [fixed, setFixed] = useState({ protein: false, fat: false, carbs: false });
      const toggleFixed = key => setFixed(f => ({ ...f, [key]: !f[key] }));

      const handleKcal = val => {
        const newKcal = Number(val);
        const fixedKcal = (fixed.protein ? goals.protein * 4 : 0) + (fixed.fat ? goals.fat * 9 : 0) + (fixed.carbs ? goals.carbs * 4 : 0);
        const freeKcal = Math.max(0, newKcal - fixedKcal);
        const freeKeys = ["protein","fat","carbs"].filter(k => !fixed[k]);
        const currentFreeKcal = freeKeys.reduce((a, k) => a + goals[k] * KCAL_PER_G[k], 0) || 1;
        const updated = { ...goals, kcal: newKcal };
        freeKeys.forEach(k => {
          updated[k] = Math.max(0, Math.round((goals[k] * KCAL_PER_G[k] / currentFreeKcal) * freeKcal / KCAL_PER_G[k]));
        });
        onChange(updated);
      };

      const handleMacro = (key, val) => {
        const newVal = Number(val);
        const delta = (newVal - goals[key]) * KCAL_PER_G[key];
        const freeKeys = ["protein","fat","carbs"].filter(k => k !== key && !fixed[k]);
        const freeKcal = freeKeys.reduce((a, k) => a + goals[k] * KCAL_PER_G[k], 0) || 1;
        const updated = { ...goals, [key]: newVal };
        if (freeKeys.length > 0) {
          freeKeys.forEach(k => {
            const share = (goals[k] * KCAL_PER_G[k]) / freeKcal;
            updated[k] = Math.max(0, Math.round(goals[k] - (delta * share) / KCAL_PER_G[k]));
          });
        }
        updated.kcal = Math.round(updated.protein * 4 + updated.fat * 9 + updated.carbs * 4);
        onChange(updated);
      };

      const macroRows = [
        { key:"protein", label:"Proteïnen", min:10, max:300, step:1, color:"#3b82f6" },
        { key:"fat", label:"Vetten", min:10, max:250, step:1, color:"#eab308" },
        { key:"carbs", label:"Koolhydraten", min:10, max:600, step:1, color:"#22c55e" },
      ];
      const macroTotal = goals.protein * 4 + goals.fat * 9 + goals.carbs * 4;
      const pctOf = key => Math.round((goals[key] * KCAL_PER_G[key] / (macroTotal || 1)) * 100);
      const totalFromMacros = Math.round(goals.protein * 4 + goals.fat * 9 + goals.carbs * 4);
      const diff = totalFromMacros - goals.kcal;

      return (
        <div>
          <h3 style={{ margin:"0 0 16px", fontSize:16 }}>🎯 Mijn doelen</h3>
          <div style={{ background:"#1e293b", borderRadius:12, padding:16, marginBottom:12 }}>
            <div style={{ display:"flex", justifyContent:"space-between", marginBottom:8 }}>
              <span style={{ fontWeight:700, color:"#f97316", fontSize:15 }}>Dagelijkse calorieën</span>
              <span style={{ fontWeight:700, color:"#f97316", fontSize:15 }}>{goals.kcal} kcal</span>
            </div>
            <input type="range" min={1000} max={4000} step={50} value={goals.kcal}
              onChange={e => handleKcal(e.target.value)}
              style={{ width:"100%", accentColor:"#f97316", height:6 }} />
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, color:"#475569", marginTop:4 }}>
              <span>1000</span><span>4000</span>
            </div>
            {Math.abs(diff) > 5 && (
              <p style={{ margin:"8px 0 0", fontSize:12, color:"#f59e0b" }}>⚠️ Macro's leveren {totalFromMacros} kcal — {Math.abs(diff)} kcal {diff>0?"boven":"onder"} je doel.</p>
            )}
          </div>
          <div style={{ background:"#1e293b", borderRadius:12, padding:16, marginBottom:12 }}>
            <p style={{ margin:"0 0 10px", fontSize:13, color:"#94a3b8" }}>Verdeling macro's</p>
            <div style={{ display:"flex", borderRadius:8, overflow:"hidden", height:18, marginBottom:8 }}>
              {macroRows.map(({ key, color }) => (
                <div key={key} style={{ flex: goals[key] * KCAL_PER_G[key], background: color, transition:"flex .3s" }} />
              ))}
            </div>
            <div style={{ display:"flex", gap:16 }}>
              {macroRows.map(({ key, label, color }) => (
                <div key={key} style={{ fontSize:12, color:"#94a3b8" }}>
                  <span style={{ display:"inline-block", width:8, height:8, borderRadius:99, background:color, marginRight:4 }} />
                  {label.split(" ")[0]}: <strong style={{ color:"#e2e8f0" }}>{pctOf(key)}%</strong>
                </div>
              ))}
            </div>
          </div>
          <div style={{ background:"#1e293b", borderRadius:12, padding:16 }}>
            <p style={{ margin:"0 0 14px", fontSize:13, color:"#94a3b8" }}>🔒 Vergrendel een macro om te voorkomen dat die meebeweegt.</p>
            {macroRows.map(({ key, label, min, max, step, color }) => (
              <div key={key} style={{ marginBottom:22 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                    <button onClick={() => toggleFixed(key)}
                      style={{ background: fixed[key] ? color : "#334155", border:"none", borderRadius:6, padding:"3px 8px", fontSize:13, cursor:"pointer", color:"#fff" }}>
                      {fixed[key] ? "🔒" : "🔓"}
                    </button>
                    <span style={{ fontWeight:600, color }}>{label}</span>
                  </div>
                  <div style={{ textAlign:"right", fontSize:13 }}>
                    <span style={{ fontWeight:700, color }}>{goals[key]}g</span>
                    <span style={{ color:"#475569", marginLeft:6 }}>= {goals[key]*KCAL_PER_G[key]} kcal</span>
                  </div>
                </div>
                <input type="range" min={min} max={max} step={step} value={goals[key]}
                  onChange={e => handleMacro(key, e.target.value)}
                  disabled={fixed[key]}
                  style={{ width:"100%", accentColor: color, height:6, opacity: fixed[key] ? 0.4 : 1 }} />
                <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, color:"#475569", marginTop:3 }}>
                  <span>{min}g</span><span>{max}g</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ── Main App ──────────────────────────────────────────────────────────────
    function App() {
      const [tab, setTab] = useState("dashboard");
      const [products, setProducts] = useState(() => load("nt_products", []));
      const [logs, setLogs] = useState(() => load("nt_logs", {}));
      const [goals, setGoals] = useState(() => load("nt_goals", DEFAULT_GOALS));
      const [showScan, setShowScan] = useState(false);
      const [scanPrefill, setScanPrefill] = useState("");
      const [pendingEntry, setPendingEntry] = useState(null);

      const saveProducts = p => { setProducts(p); save("nt_products", p); };
      const saveLogs = l => { setLogs(l); save("nt_logs", l); };
      const saveGoals = g => { setGoals(g); save("nt_goals", g); };

      const todayEntries = logs[today()] || [];
      const todayTotals = sumEntries(todayEntries);

      const addEntry = (product, grams) => {
        const entry = computeNutrition(product, grams);
        const d = today();
        const updated = { ...logs, [d]: [...(logs[d] || []), entry] };
        saveLogs(updated);
      };

      const handleQuickAdd = (text, cb) => {
        const parsed = parseEntry(text);
        if (!parsed) { cb({ type:"err", text:"Gebruik formaat: '200 gram kipfilet' of 'kipfilet 200g'" }); return; }
        const { grams, name } = parsed;
        const product = findProduct(products, name);
        if (!product) {
          cb({ type:"warn", text:`"${name}" staat nog niet in jouw bibliotheek. Camera opent…` });
          setScanPrefill(name);
          setPendingEntry({ grams, name });
          setTimeout(() => setShowScan(true), 800);
          return;
        }
        addEntry(product, grams);
        cb({ type:"ok", text:`✅ ${grams}g ${product.name} toegevoegd!` });
      };

      const handleScanSaved = product => {
        const updated = [...products, product];
        saveProducts(updated);
        setShowScan(false);
        if (pendingEntry) {
          addEntry(product, pendingEntry.grams);
          setPendingEntry(null);
        }
      };

      const removeEntry = (date, idx) => {
        const updated = { ...logs, [date]: logs[date].filter((_, i) => i !== idx) };
        saveLogs(updated);
      };

      return (
        <div style={{ minHeight:"100vh", background:"#0f172a", color:"#e2e8f0", fontFamily:"system-ui,-apple-system,sans-serif", paddingBottom:80 }}>
          {showScan && <ScanModal onClose={() => { setShowScan(false); setPendingEntry(null); }} onSaved={handleScanSaved} prefillName={scanPrefill} />}

          <div style={{ background:"#1e293b", padding:"env(safe-area-inset-top,16px) 20px 16px", display:"flex", alignItems:"center", gap:12 }}>
            <span style={{ fontSize:22 }}>🥗</span>
            <span style={{ fontWeight:700, fontSize:18 }}>NutriTrack</span>
            <span style={{ marginLeft:"auto", fontSize:12, color:"#64748b" }}>{today()}</span>
          </div>

          <div style={{ display:"flex", background:"#1e293b", borderBottom:"1px solid #334155" }}>
            {[["dashboard","📊 Vandaag"],["week","📅 Week"],["library","📚 Bibliotheek"],["goals","🎯 Doelen"]].map(([id,label]) => (
              <button key={id} onClick={() => setTab(id)} style={{
                flex:1, padding:"12px 4px", border:"none", background:"none",
                color: tab===id ? "#f97316" : "#64748b",
                fontWeight: tab===id ? 700 : 400, fontSize:12, cursor:"pointer",
                borderBottom: tab===id ? "2px solid #f97316" : "2px solid transparent"
              }}>{label}</button>
            ))}
          </div>

          <div style={{ padding:16, maxWidth:500, margin:"0 auto" }}>
            {tab === "dashboard" && <Dashboard goals={goals} totals={todayTotals} entries={todayEntries}
              onQuickAdd={handleQuickAdd} onScan={() => { setScanPrefill(""); setPendingEntry(null); setShowScan(true); }}
              onRemove={idx => removeEntry(today(), idx)} />}
            {tab === "week" && <WeekView logs={logs} goals={goals} />}
            {tab === "library" && <Library products={products} onScan={() => { setScanPrefill(""); setShowScan(true); }} onDelete={id => saveProducts(products.filter(p => p.id !== id))} />}
            {tab === "goals" && <Goals goals={goals} onChange={saveGoals} />}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
