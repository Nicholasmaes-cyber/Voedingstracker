<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="NutriTrack"/>
  <meta name="theme-color" content="#0f172a"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon.png"/>
  <title>NutriTrack</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%}
    body{background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
    input,button{font-family:inherit}
    input[type=range]{width:100%;cursor:pointer}
    details summary{list-style:none;cursor:pointer}
    details summary::-webkit-details-marker{display:none}
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:#1e293b}
    ::-webkit-scrollbar-thumb{background:#334155;border-radius:99px}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── storage (localStorage) ────────────────────────────────────────────────────
function sget(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; }
}
function sset(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

// ── constants ─────────────────────────────────────────────────────────────────
const todayStr = () => new Date().toISOString().slice(0,10);
const round1 = v => Math.round((v||0)*10)/10;
const pct = (v,g) => Math.min(100, Math.round((v/(g||1))*100));
const SK = { products:"nt_p4", logs:"nt_l4", goals:"nt_g4", progress:"nt_prog4" };
const DEF_GOALS = { protein:150, fat:70, carbs:200 };
const DEF_PROG = { targetKg:5, kcalPerKg:7700 };
const MC = { kcal:"#f97316", protein:"#3b82f6", fat:"#eab308", carbs:"#22c55e" };
const VITS = {
  vitA:"Vit. A",vitC:"Vit. C",vitD:"Vit. D",vitE:"Vit. E",vitK:"Vit. K",
  vitB1:"B1",vitB2:"B2",vitB6:"B6",vitB12:"B12",folate:"Folaat",
  calcium:"Calcium",iron:"IJzer",magnesium:"Magnesium",zinc:"Zink",
  potassium:"Kalium",sodium:"Natrium",fiber:"Vezels"
};

// ── API ───────────────────────────────────────────────────────────────────────
async function searchProductNutrition(query) {
  const res = await fetch("/.netlify/functions/claude", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      model:"claude-sonnet-4-20250514", max_tokens:1000,
      tools:[{type:"web_search_20250305",name:"web_search"}],
      messages:[{role:"user",content:
        `Zoek de voedingswaarden op van: "${query}". Geef ALLEEN een JSON-object terug (geen markdown) per 100g:
{"name":"exacte productnaam","kcal":0,"protein":0,"fat":0,"carbs":0,"sugar":null,"saturatedFat":null,"fiber":null,"salt":null,"sodium":null,"vitA":null,"vitC":null,"vitD":null,"vitE":null,"vitK":null,"vitB1":null,"vitB2":null,"vitB6":null,"vitB12":null,"folate":null,"calcium":null,"iron":null,"magnesium":null,"zinc":null,"potassium":null}`
      }]
    })
  });
  const data = await res.json();
  const text = (data.content?.filter(b=>b.type==="text").map(b=>b.text).join("")||"").trim();
  const clean = text.replace(/```json|```/g,"").trim();
  const s=clean.indexOf("{"),e=clean.lastIndexOf("}");
  if(s===-1||e===-1) throw new Error("Geen resultaat");
  return JSON.parse(clean.slice(s,e+1));
}

// ── fuzzy search ──────────────────────────────────────────────────────────────
function tokenize(s){return s.toLowerCase().replace(/[^a-z0-9\s]/g,"").split(/\s+/).filter(Boolean);}
function scoreMatch(product,query){
  const qt=tokenize(query),pf=product.name.toLowerCase(),pt=tokenize(product.name);
  let sc=0;
  for(const q of qt){
    if(pf.includes(q)){sc+=q.length*2;continue;}
    if(pt.some(p=>p.startsWith(q)||q.startsWith(p))) sc+=q.length;
  }
  return sc;
}
function findProduct(products,query){
  if(!query.trim()) return null;
  const sc=products.map(p=>({p,s:scoreMatch(p,query)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  return sc.length?sc[0].p:null;
}

// ── entry parsing ─────────────────────────────────────────────────────────────
function parseEntry(text){
  const t=text.trim();
  const gA=t.match(/^(\d+(?:[.,]\d+)?)\s*(?:gr?|gram|g)\s+(.+)$/i);
  if(gA) return {grams:parseFloat(gA[1].replace(",",".")),name:gA[2].trim()};
  const gB=t.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)\s*(?:gr?|gram|g)$/i);
  if(gB) return {grams:parseFloat(gB[2].replace(",",".")),name:gB[1].trim()};
  const pA=t.match(/^(\d+(?:[.,]\d+)?)\s+(\S+)\s+(.+)$/i);
  if(pA) return {count:parseFloat(pA[1].replace(",",".")),unit:pA[2].toLowerCase(),name:pA[3].trim()};
  return null;
}
function resolveGrams(parsed,product){
  if(parsed.grams!=null) return parsed.grams;
  if(parsed.count!=null&&product.portionGrams){
    const u=parsed.unit.replace(/s$/,""),pu=(product.portionUnit||"").toLowerCase().replace(/s$/,"");
    if(!pu||u===pu||pu.startsWith(u)||u.startsWith(pu)) return Math.round(parsed.count*product.portionGrams);
  }
  return null;
}

// ── nutrition calc ────────────────────────────────────────────────────────────
function computeNutrition(product,grams){
  const f=grams/100,r={grams,productId:product.id,productName:product.name};
  ["kcal","protein","fat","carbs","sugar","saturatedFat","fiber","salt",...Object.keys(VITS)]
    .forEach(k=>{r[k]=product[k]!=null?round1(product[k]*f):null;});
  return r;
}
function sumEntries(entries){
  const keys=["kcal","protein","fat","carbs","sugar","saturatedFat","fiber","salt",...Object.keys(VITS)];
  const s={};keys.forEach(k=>{s[k]=round1(entries.reduce((a,e)=>a+(e[k]||0),0));});return s;
}

const B=(bg,ex={})=>({background:bg,color:"#fff",border:"none",borderRadius:8,padding:"10px 18px",fontWeight:600,fontSize:14,cursor:"pointer",...ex});

// ── MacroBar ──────────────────────────────────────────────────────────────────
function MacroBar({label,value,goal,color}){
  return(
    <div style={{marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:3}}>
        <span style={{fontWeight:600,color}}>{label}</span>
        <span style={{color:"#94a3b8"}}>{value} / {goal}{label==="Kcal"?" kcal":"g"}</span>
      </div>
      <div style={{background:"#0f172a",borderRadius:99,height:8,overflow:"hidden"}}>
        <div style={{width:`${pct(value,goal)}%`,background:color,height:"100%",borderRadius:99,transition:"width .4s"}}/>
      </div>
    </div>
  );
}

// ── EditableNutritionForm ─────────────────────────────────────────────────────
function EditableNutritionForm({data,onChange}){
  const main=[
    {k:"kcal",label:"Calorieën",unit:"kcal",req:true,color:"#f97316"},
    {k:"protein",label:"Proteïnen",unit:"g",req:true,color:"#3b82f6"},
    {k:"fat",label:"Vetten",unit:"g",req:true,color:"#eab308"},
    {k:"carbs",label:"Koolhydraten",unit:"g",req:true,color:"#22c55e"},
    {k:"sugar",label:"Waarvan suikers",unit:"g"},{k:"saturatedFat",label:"Waarvan verzadigd",unit:"g"},
    {k:"fiber",label:"Vezels",unit:"g"},{k:"salt",label:"Zout",unit:"g"},
  ];
  const inp={padding:"7px 9px",borderRadius:7,border:"1px solid #334155",background:"#0f172a",color:"#e2e8f0",fontSize:13,width:"80px",textAlign:"right"};
  return(
    <div>
      <p style={{margin:"0 0 8px",fontSize:11,color:"#475569"}}>Per 100g</p>
      <div style={{marginBottom:10}}>
        {main.map(({k,label,unit,req,color})=>(
          <div key={k} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",borderBottom:"1px solid #1e293b"}}>
            <span style={{fontSize:13,color:color||"#94a3b8",fontWeight:req?600:400}}>{label}{req&&<span style={{color:"#ef4444"}}> *</span>}</span>
            <div style={{display:"flex",alignItems:"center",gap:5}}>
              <input type="number" value={data[k]??""} onChange={e=>onChange({...data,[k]:e.target.value===""?null:parseFloat(e.target.value)})} style={inp}/>
              <span style={{fontSize:12,color:"#475569",width:24}}>{unit}</span>
            </div>
          </div>
        ))}
      </div>
      <details>
        <summary style={{fontSize:12,color:"#475569",marginBottom:8}}>🌿 Vitamines &amp; mineralen</summary>
        {Object.entries(VITS).map(([k,label])=>(
          <div key={k} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0",borderBottom:"1px solid #1e293b"}}>
            <span style={{fontSize:12,color:"#64748b"}}>{label}</span>
            <input type="number" value={data[k]??""} onChange={e=>onChange({...data,[k]:e.target.value===""?null:parseFloat(e.target.value)})} style={{...inp,width:60}}/>
          </div>
        ))}
      </details>
    </div>
  );
}

// ── AddProductModal ───────────────────────────────────────────────────────────
function AddProductModal({onClose,onSaved,prefillName}){
  const [query,setQuery]=useState(prefillName||"");
  const [status,setStatus]=useState(null);
  const [edited,setEdited]=useState(null);
  const [searching,setSearching]=useState(false);

  const doSearch=async()=>{
    if(!query.trim()) return;
    setSearching(true);setStatus({t:"loading",msg:`Zoeken naar "${query}"…`});setEdited(null);
    try{
      const r=await searchProductNutrition(query.trim());
      setEdited({...r});setStatus({t:"ok",msg:`✅ Gevonden: ${r.name}`});
    }catch{setStatus({t:"err",msg:"Niets gevonden. Pas zoekopdracht aan of vul manueel in."});}
    finally{setSearching(false);}
  };

  const handleSave=()=>{
    if(!edited) return;
    const p={...edited,id:Date.now().toString()};
    ["kcal","protein","fat","carbs","sugar","saturatedFat","fiber","salt",...Object.keys(VITS)]
      .forEach(k=>{if(p[k]!=null) p[k]=parseFloat(p[k])||null;});
    if(p.portionGrams) p.portionGrams=parseFloat(p.portionGrams)||null;
    onSaved(p);
  };

  const valid=edited&&edited.name?.trim()&&edited.kcal!=null&&edited.protein!=null&&edited.fat!=null&&edited.carbs!=null;
  const inp={width:"100%",padding:"9px 11px",borderRadius:8,border:"1px solid #334155",background:"#0f172a",color:"#e2e8f0",fontSize:14,boxSizing:"border-box",marginBottom:10};

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center"}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:"#1e293b",borderRadius:"16px 16px 0 0",padding:20,width:"100%",maxWidth:480,maxHeight:"92vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <h2 style={{margin:0,fontSize:17}}>➕ Product toevoegen</h2>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#94a3b8",fontSize:24,cursor:"pointer"}}>×</button>
        </div>
        <p style={{margin:"0 0 8px",fontSize:13,color:"#94a3b8"}}>Typ naam en merk:</p>
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          <input value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doSearch()}
            placeholder="bv. Verstegen Smokey BBQ Sauce"
            style={{flex:1,padding:"10px 12px",borderRadius:8,border:"1px solid #334155",background:"#0f172a",color:"#e2e8f0",fontSize:14}}/>
          <button onClick={doSearch} disabled={searching||!query.trim()} style={{...B("#6366f1",{padding:"10px 16px"}),opacity:query.trim()?1:.4}}>
            {searching?"…":"🔍"}
          </button>
        </div>
        {status&&<p style={{margin:"0 0 12px",fontSize:13,color:status.t==="ok"?"#22c55e":status.t==="loading"?"#94a3b8":"#ef4444"}}>{status.msg}</p>}
        {edited&&(
          <div>
            <label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:3}}>Productnaam</label>
            <input value={edited.name||""} onChange={e=>setEdited({...edited,name:e.target.value})} style={inp}/>
            <label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:3}}>🍽️ Portie (optioneel)</label>
            <div style={{display:"flex",gap:8,marginBottom:10}}>
              <input value={edited.portionUnit||""} onChange={e=>setEdited({...edited,portionUnit:e.target.value})}
                placeholder="eenheid (bar, stuk…)"
                style={{flex:1,padding:"9px 11px",borderRadius:8,border:"1px solid #334155",background:"#0f172a",color:"#e2e8f0",fontSize:13}}/>
              <input type="number" value={edited.portionGrams||""} onChange={e=>setEdited({...edited,portionGrams:e.target.value})}
                placeholder="gram"
                style={{width:80,padding:"9px 11px",borderRadius:8,border:"1px solid #334155",background:"#0f172a",color:"#e2e8f0",fontSize:13}}/>
            </div>
            {edited.portionUnit&&edited.portionGrams&&<p style={{margin:"-4px 0 10px",fontSize:12,color:"#22c55e"}}>→ "1 {edited.portionUnit} {edited.name}" = {edited.portionGrams}g</p>}
            <div style={{background:"#0f172a",borderRadius:10,padding:14,marginBottom:14}}>
              <EditableNutritionForm data={edited} onChange={setEdited}/>
            </div>
            <button onClick={handleSave} disabled={!valid} style={{...B("#22c55e",{width:"100%",fontSize:15,padding:"12px"}),opacity:valid?1:.4}}>
              💾 Opslaan in bibliotheek
            </button>
          </div>
        )}
        {!edited&&!searching&&(
          <button onClick={()=>setEdited({name:query,kcal:null,protein:null,fat:null,carbs:null,...Object.fromEntries(Object.keys(VITS).map(k=>[k,null]))})}
            style={{...B("#475569",{width:"100%",fontSize:13})}}>✏️ Manueel invullen</button>
        )}
      </div>
    </div>
  );
}

// ── LibraryCard ───────────────────────────────────────────────────────────────
function LibraryCard({p,onDelete,onSave}){
  const [open,setOpen]=useState(false);
  const [draft,setDraft]=useState(null);
  function openEdit(){setDraft({...p});setOpen(true);}
  function closeEdit(){setOpen(false);setDraft(null);}
  function saveEdit(){
    if(!draft?.name?.trim()) return;
    const c={...draft};
    ["kcal","protein","fat","carbs","sugar","saturatedFat","fiber","salt",...Object.keys(VITS)]
      .forEach(k=>{if(c[k]!=null) c[k]=parseFloat(c[k])||null;});
    if(c.portionGrams) c.portionGrams=parseFloat(c.portionGrams)||null;
    onSave(c);closeEdit();
  }
  const inp={padding:"8px 10px",borderRadius:7,border:"1px solid #334155",background:"#0f172a",color:"#e2e8f0",fontSize:13,boxSizing:"border-box"};
  return(
    <div style={{background:"#1e293b",borderRadius:10,marginBottom:10,overflow:"hidden"}}>
      <div style={{padding:"12px 14px"}}>
        <div style={{fontWeight:700,fontSize:15,marginBottom:3}}>{p.name}</div>
        <div style={{fontSize:12,color:"#94a3b8",marginBottom:10}}>
          {p.kcal} kcal · {p.protein}g eiwit · {p.fat}g vet · {p.carbs}g kh
          {p.portionUnit&&p.portionGrams&&<span style={{color:"#818cf8",display:"block",marginTop:2}}>🍽️ 1 {p.portionUnit} = {p.portionGrams}g</span>}
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={open?closeEdit:openEdit} style={{flex:1,padding:"10px 0",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:15,
            background:open?"#1e293b":"#172554",border:"2px solid "+(open?"#64748b":"#3b82f6"),color:open?"#94a3b8":"#93c5fd"}}>
            {open?"✕ Sluiten":"✏️ Bewerken"}
          </button>
          <button onClick={()=>onDelete(p.id)} style={{padding:"10px 16px",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:15,
            background:"#2d0a0a",border:"2px solid #991b1b",color:"#fca5a5"}}>🗑️</button>
        </div>
      </div>
      {open&&draft&&(
        <div style={{padding:"0 14px 14px",borderTop:"2px solid #0f172a"}}>
          <div style={{paddingTop:12,marginBottom:10}}>
            <label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>Productnaam</label>
            <input value={draft.name||""} onChange={e=>setDraft({...draft,name:e.target.value})} style={{...inp,width:"100%"}}/>
          </div>
          <div style={{marginBottom:10}}>
            <label style={{fontSize:11,color:"#64748b",display:"block",marginBottom:4}}>🍽️ Portie (optioneel)</label>
            <div style={{display:"flex",gap:8}}>
              <input value={draft.portionUnit||""} onChange={e=>setDraft({...draft,portionUnit:e.target.value})}
                placeholder="eenheid (bar, stuk…)" style={{...inp,flex:1}}/>
              <input type="number" value={draft.portionGrams||""} onChange={e=>setDraft({...draft,portionGrams:e.target.value})}
                placeholder="gram" style={{...inp,width:72}}/>
            </div>
            {draft.portionUnit&&draft.portionGrams&&
              <p style={{margin:"5px 0 0",fontSize:12,color:"#22c55e"}}>→ "1 {draft.portionUnit} {draft.name}" = {draft.portionGrams}g</p>}
          </div>
          <div style={{background:"#0f172a",borderRadius:8,padding:12,marginBottom:10}}>
            <EditableNutritionForm data={draft} onChange={setDraft}/>
          </div>
          <button onClick={saveEdit} style={{...B("#22c55e"),width:"100%",padding:"11px",fontSize:15}}>💾 Opslaan</button>
        </div>
      )}
    </div>
  );
}

// ── Library ───────────────────────────────────────────────────────────────────
function Library({products,onAdd,onDelete,onSave}){
  const [search,setSearch]=useState("");
  const filtered=search.trim()
    ?products.map(p=>({p,s:scoreMatch(p,search)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.p)
    :products;
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <h3 style={{margin:0,fontSize:16}}>Productbibliotheek</h3>
        <button onClick={onAdd} style={B("#6366f1",{fontSize:13,padding:"8px 14px"})}>➕ Toevoegen</button>
      </div>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Zoek product…"
        style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1px solid #334155",background:"#1e293b",color:"#e2e8f0",fontSize:14,marginBottom:14,boxSizing:"border-box"}}/>
      {filtered.length===0&&<p style={{textAlign:"center",color:"#475569",marginTop:30}}>Geen producten gevonden.</p>}
      {filtered.map(p=><LibraryCard key={p.id} p={p} onDelete={onDelete} onSave={onSave}/>)}
    </div>
  );
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function Dashboard({goals,totals,entries,quickText,setQuickText,quickMsg,onQuickAdd,onAddProduct,onRemove,burnedKcal,onSaveBurned}){
  const [burnInput,setBurnInput]=useState(burnedKcal>0?String(burnedKcal):"");
  const [saved,setSaved]=useState(false);
  const handleSave=()=>{onSaveBurned(parseFloat(burnInput)||0);setSaved(true);setTimeout(()=>setSaved(false),2000);};
  const eaten=totals.kcal||0,burned=burnedKcal||0,net=burned-eaten;
  const barPct=burned>0?Math.min(100,Math.round((eaten/burned)*100)):0;
  return(
    <div>
      <h3 style={{margin:"0 0 14px",fontSize:16}}>Vandaag</h3>
      <div style={{background:"#1e293b",borderRadius:12,padding:16,marginBottom:14}}>
        <p style={{margin:"0 0 10px",fontWeight:600,fontSize:14}}>🔥 Totaal verbrand vandaag</p>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <input type="number" value={burnInput} onChange={e=>setBurnInput(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&handleSave()} placeholder="kcal van je horloge"
            style={{flex:1,padding:"10px 12px",borderRadius:8,border:"1px solid #334155",background:"#0f172a",color:"#e2e8f0",fontSize:14}}/>
          <span style={{color:"#64748b",fontSize:13,whiteSpace:"nowrap"}}>kcal</span>
          <button onClick={handleSave} style={B("#f97316",{padding:"10px 14px"})}>{saved?"✅":"💾"}</button>
        </div>
      </div>
      <div style={{background:"#1e293b",borderRadius:12,padding:16,marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:10,fontSize:13}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontWeight:700,fontSize:20,color:"#f97316"}}>{eaten}</div>
            <div style={{color:"#64748b"}}>gegeten</div>
          </div>
          <div style={{textAlign:"center"}}>
            <div style={{fontWeight:700,fontSize:20,color:net>=0?"#22c55e":"#ef4444"}}>{net>=0?`-${net}`:`+${Math.abs(net)}`}</div>
            <div style={{color:"#64748b"}}>{net>=0?"tekort":"overschot"}</div>
          </div>
          <div style={{textAlign:"center"}}>
            <div style={{fontWeight:700,fontSize:20,color:"#3b82f6"}}>{burned||"—"}</div>
            <div style={{color:"#64748b"}}>verbrand</div>
          </div>
        </div>
        {burned>0&&(
          <>
            <div style={{background:"#0f172a",borderRadius:99,height:14,overflow:"hidden",marginBottom:6,position:"relative"}}>
              <div style={{position:"absolute",left:0,top:0,height:"100%",width:`${barPct}%`,
                background:net>=0?"#f97316":"#ef4444",borderRadius:99,transition:"width .4s"}}/>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#475569"}}>
              <span>0</span><span>{burned} kcal verbrand</span>
            </div>
          </>
        )}
        {!burned&&<p style={{margin:"4px 0 0",fontSize:12,color:"#475569",textAlign:"center"}}>Vul verbrandde kcal in om je balans te zien</p>}
      </div>
      <div style={{background:"#1e293b",borderRadius:12,padding:16,marginBottom:14}}>
        <p style={{margin:"0 0 10px",fontWeight:600,fontSize:14}}>📊 Macro's (minimumdoelen)</p>
        <MacroBar label="Proteïnen" value={totals.protein||0} goal={goals.protein} color={MC.protein}/>
        <MacroBar label="Vetten" value={totals.fat||0} goal={goals.fat} color={MC.fat}/>
        <MacroBar label="Koolhydraten" value={totals.carbs||0} goal={goals.carbs} color={MC.carbs}/>
      </div>
      <div style={{background:"#1e293b",borderRadius:12,padding:16,marginBottom:14}}>
        <p style={{margin:"0 0 10px",fontWeight:600,fontSize:14}}>⚡ Snel toevoegen</p>
        <div style={{display:"flex",gap:8}}>
          <input value={quickText} onChange={e=>setQuickText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&onQuickAdd()}
            placeholder="200g kipfilet of 1 bar proteinereep"
            style={{flex:1,padding:"10px 12px",borderRadius:8,border:"1px solid #334155",background:"#0f172a",color:"#e2e8f0",fontSize:14}}/>
          <button onClick={onQuickAdd} style={B("#f97316",{padding:"10px 14px"})}>+</button>
          <button onClick={onAddProduct} style={B("#6366f1",{padding:"10px 14px"})}>➕</button>
        </div>
        {quickMsg&&<p style={{margin:"8px 0 0",fontSize:13,color:quickMsg.t==="ok"?"#22c55e":quickMsg.t==="warn"?"#f59e0b":"#ef4444"}}>{quickMsg.msg}</p>}
      </div>
      {entries.length>0?(
        <div style={{background:"#1e293b",borderRadius:12,padding:16}}>
          <p style={{margin:"0 0 12px",fontWeight:600,fontSize:14}}>Maaltijden vandaag</p>
          {entries.map((e,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #0f172a"}}>
              <div style={{flex:1}}>
                <span style={{fontWeight:600,fontSize:14}}>{e.productName}</span>
                <span style={{color:"#64748b",fontSize:13}}> — {e.grams}g</span>
                <div style={{fontSize:12,color:"#94a3b8",marginTop:2}}>{e.kcal} kcal · {e.protein}g eiwit · {e.fat}g vet · {e.carbs}g kh</div>
              </div>
              <button onClick={()=>onRemove(i)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:20}}>×</button>
            </div>
          ))}
        </div>
      ):(
        <div style={{textAlign:"center",color:"#475569",marginTop:40}}>
          <div style={{fontSize:44}}>🍽️</div>
          <p>Nog niets gelogd vandaag.</p>
        </div>
      )}
    </div>
  );
}

// ── WeekView ──────────────────────────────────────────────────────────────────
function WeekView({logs,goals,getBurned}){
  const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d.toISOString().slice(0,10);});
  const vitKeys=Object.keys(VITS);
  const dayTotals=days.map(d=>({date:d,...sumEntries(logs[d]||[])}));
  const macros=["kcal","protein","fat","carbs"];
  const avg={};
  [...macros,...vitKeys].forEach(k=>{avg[k]=round1(dayTotals.reduce((a,d)=>a+(d[k]||0),0)/7);});
  const advice=[];
  if((goals.protein&&avg.protein<goals.protein*0.85)) advice.push({e:"💪",t:"Je proteïne-inname ligt wat laag."});
  const lowV=vitKeys.filter(k=>avg[k]!=null&&avg[k]<1);
  if(lowV.length) advice.push({e:"🌿",t:`Lage inname van: ${lowV.map(k=>VITS[k]).join(", ")}.`});
  if(!advice.length) advice.push({e:"✅",t:"Goede week! Je zit goed in balans."});
  return(
    <div>
      <h3 style={{margin:"0 0 14px",fontSize:16}}>Weekoverzicht</h3>
      <div style={{background:"#1e293b",borderRadius:12,padding:16,marginBottom:12}}>
        <p style={{margin:"0 0 10px",fontWeight:600,fontSize:14}}>Calorieën per dag</p>
        {dayTotals.map(d=>{
          const burned=getBurned(d.date)||0;
          return(
            <div key={d.date} style={{marginBottom:8}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:2}}>
                <span style={{color:"#94a3b8"}}>{d.date.slice(5)}</span>
                <span style={{color:"#94a3b8"}}>{d.kcal||0} gegeten{burned>0?` / ${burned} verbrand`:""}</span>
              </div>
              <div style={{background:"#0f172a",borderRadius:99,height:6}}>
                <div style={{width:`${burned>0?Math.min(100,Math.round(((d.kcal||0)/burned)*100)):0}%`,background:"#f97316",height:"100%",borderRadius:99}}/>
              </div>
            </div>
          );
        })}
      </div>
      <div style={{background:"#1e293b",borderRadius:12,padding:16,marginBottom:12}}>
        <p style={{margin:"0 0 10px",fontWeight:600,fontSize:14}}>Gemiddelde macro's</p>
        {macros.map(k=>(
          <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #0f172a",fontSize:13}}>
            <span style={{color:MC[k]}}>{k==="kcal"?"Calorieën":k==="protein"?"Proteïnen":k==="fat"?"Vetten":"Koolhydraten"}</span>
            <span>{avg[k]} {k==="kcal"?"kcal":"g"}</span>
          </div>
        ))}
      </div>
      {vitKeys.some(k=>avg[k]>0)&&(
        <div style={{background:"#1e293b",borderRadius:12,padding:16,marginBottom:12}}>
          <p style={{margin:"0 0 10px",fontWeight:600,fontSize:14}}>Vitamines &amp; mineralen (gem.)</p>
          {vitKeys.filter(k=>avg[k]>0).map(k=>(
            <div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:13,padding:"3px 0",borderBottom:"1px solid #0f172a"}}>
              <span style={{color:"#94a3b8"}}>{VITS[k]}</span><span>{avg[k]}/dag</span>
            </div>
          ))}
        </div>
      )}
      <div style={{background:"#1e293b",borderRadius:12,padding:16}}>
        <p style={{margin:"0 0 10px",fontWeight:600,fontSize:14}}>💡 Advies</p>
        {advice.map((a,i)=>(
          <div key={i} style={{display:"flex",gap:10,padding:"8px 0",borderBottom:i<advice.length-1?"1px solid #0f172a":"none"}}>
            <span style={{fontSize:18}}>{a.e}</span><span style={{fontSize:13,color:"#cbd5e1",lineHeight:1.5}}>{a.t}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── ProgressView ──────────────────────────────────────────────────────────────
function ProgressView({logs,progressCfg,onChangeCfg,getBurned}){
  const {targetKg,kcalPerKg}=progressCfg;
  const total=targetKg*kcalPerKg;
  const allDays=Object.keys(logs).filter(k=>!k.endsWith("_sport")).sort();
  let cum=0;
  const dayData=allDays.map(d=>{
    const eaten=sumEntries(logs[d]||[]).kcal||0;
    const burned=getBurned(d)||0;
    const net=burned-eaten;
    cum+=net;
    return {d,eaten,burned,net};
  }).filter(d=>d.eaten>0||d.burned>0);
  const deficit=Math.max(0,cum),surplus=Math.max(0,-cum);
  const kgLost=round1(deficit/kcalPerKg),kgGained=round1(surplus/kcalPerKg);
  const barPct=Math.min(100,Math.round((deficit/total)*100));
  const barColor=barPct>=100?"#22c55e":barPct>=50?"#3b82f6":"#f97316";
  const ni={padding:"7px 9px",borderRadius:7,border:"1px solid #334155",background:"#0f172a",color:"#e2e8f0",fontSize:14,textAlign:"center"};
  return(
    <div>
      <h3 style={{margin:"0 0 14px",fontSize:16}}>🏆 Progress</h3>
      <div style={{background:"#1e293b",borderRadius:12,padding:16,marginBottom:14}}>
        <p style={{margin:"0 0 12px",fontWeight:600,fontSize:14}}>🎯 Doelstelling</p>
        <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:10}}>
          <label style={{fontSize:13,color:"#94a3b8",whiteSpace:"nowrap"}}>Ik wil</label>
          <input type="number" value={targetKg} min={0.5} max={50} step={0.5}
            onChange={e=>onChangeCfg({...progressCfg,targetKg:parseFloat(e.target.value)||1})}
            style={{...ni,width:60}}/>
          <label style={{fontSize:13,color:"#94a3b8"}}>kg afvallen</label>
        </div>
        <div style={{display:"flex",gap:12,alignItems:"center"}}>
          <label style={{fontSize:13,color:"#94a3b8",whiteSpace:"nowrap"}}>Kcal per kg</label>
          <input type="number" value={kcalPerKg} min={3500} max={10000} step={100}
            onChange={e=>onChangeCfg({...progressCfg,kcalPerKg:parseFloat(e.target.value)||7700})}
            style={{...ni,width:80}}/>
          <label style={{fontSize:13,color:"#475569"}}>(standaard 7.700)</label>
        </div>
        <p style={{margin:"10px 0 0",fontSize:12,color:"#475569"}}>Totaal tekort nodig: <strong style={{color:"#e2e8f0"}}>{total.toLocaleString()} kcal</strong></p>
      </div>
      <div style={{background:"#1e293b",borderRadius:12,padding:16,marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:12}}>
          <div>
            <p style={{margin:0,fontWeight:700,fontSize:26,color:barColor}}>{kgLost} kg</p>
            <p style={{margin:0,fontSize:12,color:"#64748b"}}>verloren van {targetKg} kg doel</p>
          </div>
          <div style={{textAlign:"right"}}>
            <p style={{margin:0,fontWeight:700,fontSize:18,color:"#e2e8f0"}}>{barPct}%</p>
            <p style={{margin:0,fontSize:12,color:"#64748b"}}>{Math.round(deficit).toLocaleString()} / {total.toLocaleString()} kcal</p>
          </div>
        </div>
        <div style={{background:"#0f172a",borderRadius:99,height:22,overflow:"hidden",marginBottom:6}}>
          <div style={{width:`${barPct}%`,background:`linear-gradient(90deg,${barColor}88,${barColor})`,height:"100%",borderRadius:99,transition:"width .6s",display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:8,boxSizing:"border-box"}}>
            {barPct>10&&<span style={{fontSize:11,fontWeight:700,color:"#fff"}}>{barPct}%</span>}
          </div>
        </div>
        <p style={{margin:"4px 0 0",fontSize:12,color:"#475569"}}>
          Nog <strong style={{color:"#e2e8f0"}}>{round1(Math.max(0,targetKg-kgLost))} kg</strong> te gaan ({Math.max(0,Math.round(total-deficit)).toLocaleString()} kcal)
        </p>
        {surplus>0&&<p style={{margin:"6px 0 0",fontSize:12,color:"#ef4444"}}>⚠️ Cumulatief {Math.round(surplus).toLocaleString()} kcal boven verbranding (+{kgGained} kg)</p>}
      </div>
      {dayData.length>0&&(
        <div style={{background:"#1e293b",borderRadius:12,padding:16}}>
          <p style={{margin:"0 0 12px",fontWeight:600,fontSize:14}}>📅 Per dag</p>
          {dayData.slice().reverse().slice(0,14).map(({d,eaten,burned,net})=>(
            <div key={d} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid #0f172a",fontSize:13}}>
              <span style={{color:"#94a3b8",minWidth:50}}>{d.slice(5)}</span>
              <span style={{color:"#64748b",flex:1,textAlign:"center"}}>{eaten} gegeten</span>
              <span style={{color:"#3b82f6",flex:1,textAlign:"center"}}>{burned>0?`${burned} verbrand`:"—"}</span>
              <span style={{fontWeight:600,color:net>=0?"#22c55e":"#ef4444",minWidth:70,textAlign:"right"}}>
                {net>=0?`-${Math.round(net)}`:`+${Math.round(-net)}`} kcal
              </span>
            </div>
          ))}
        </div>
      )}
      {dayData.length===0&&(
        <div style={{textAlign:"center",color:"#475569",marginTop:40}}>
          <div style={{fontSize:44}}>📊</div><p>Begin met loggen om je progress te zien!</p>
        </div>
      )}
    </div>
  );
}

// ── BackupRestore ─────────────────────────────────────────────────────────────
function BackupRestore({onImport}) {
  const [msg, setMsg] = useState(null);
  const fileRef = useRef();

  const exportData = () => {
    const data = {
      products: sget(SK.products, []),
      logs: sget(SK.logs, {}),
      goals: sget(SK.goals, DEF_GOALS),
      progress: sget(SK.progress, DEF_PROG),
      exportDate: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `nutritrack-backup-${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    setMsg({t:"ok", msg:"✅ Backup gedownload!"});
    setTimeout(() => setMsg(null), 3000);
  };

  const importData = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.products || !data.logs) throw new Error("Ongeldig bestand");
        sset(SK.products, data.products);
        sset(SK.logs, data.logs);
        if (data.goals) sset(SK.goals, data.goals);
        if (data.progress) sset(SK.progress, data.progress);
        onImport();
        setMsg({t:"ok", msg:`✅ ${data.products.length} producten en logs hersteld!`});
      } catch {
        setMsg({t:"err", msg:"❌ Ongeldig bestand. Gebruik een NutriTrack backup."});
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <div style={{background:"#1e293b", borderRadius:12, padding:16, marginBottom:14}}>
      <p style={{margin:"0 0 12px", fontWeight:600, fontSize:14}}>💾 Backup & Herstel</p>
      <p style={{margin:"0 0 12px", fontSize:13, color:"#94a3b8"}}>
        Download regelmatig een backup zodat je je data nooit kwijt bent bij updates.
      </p>
      <div style={{display:"flex", gap:8}}>
        <button onClick={exportData} style={{...B("#22c55e", {flex:1, fontSize:13, padding:"10px 8px"})}}>
          ⬇️ Download backup
        </button>
        <button onClick={() => fileRef.current.click()} style={{...B("#6366f1", {flex:1, fontSize:13, padding:"10px 8px"})}}>
          ⬆️ Herstel backup
        </button>
      </div>
      <input ref={fileRef} type="file" accept=".json" style={{display:"none"}} onChange={importData}/>
      {msg && <p style={{margin:"8px 0 0", fontSize:13, color:msg.t==="ok"?"#22c55e":"#ef4444"}}>{msg.msg}</p>}
    </div>
  );
}

// ── Goals ─────────────────────────────────────────────────────────────────────
function Goals({goals,onChange}){
  const rows=[
    {key:"protein",label:"Proteïnen (minimum)",min:10,max:300,color:"#3b82f6"},
    {key:"fat",label:"Vetten (minimum)",min:10,max:250,color:"#eab308"},
    {key:"carbs",label:"Koolhydraten (minimum)",min:10,max:600,color:"#22c55e"},
  ];
  return(
    <div>
      <h3 style={{margin:"0 0 6px",fontSize:16}}>🎯 Macro-doelen</h3>
      <p style={{margin:"0 0 16px",fontSize:13,color:"#64748b"}}>Dagelijkse minimumdoelen per macro.</p>
      <div style={{background:"#1e293b",borderRadius:12,padding:16}}>
        {rows.map(({key,label,min,max,color})=>(
          <div key={key} style={{marginBottom:24}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
              <span style={{fontWeight:600,color,fontSize:14}}>{label}</span>
              <span style={{fontWeight:700,color,fontSize:14}}>{goals[key]}g</span>
            </div>
            <input type="range" min={min} max={max} step={1} value={goals[key]}
              onChange={e=>onChange({...goals,[key]:Number(e.target.value)})}
              style={{width:"100%",accentColor:color}}/>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#475569",marginTop:3}}><span>{min}g</span><span>{max}g</span></div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState("dashboard");
  const [products,setProducts]=useState(()=>sget(SK.products,[]));
  const [logs,setLogs]=useState(()=>sget(SK.logs,{}));
  const [goals,setGoals]=useState(()=>sget(SK.goals,DEF_GOALS));
  const [progCfg,setProgCfg]=useState(()=>sget(SK.progress,DEF_PROG));
  const [showAdd,setShowAdd]=useState(false);
  const [addPrefill,setAddPrefill]=useState("");
  const [pendingEntry,setPendingEntry]=useState(null);
  const [quickText,setQuickText]=useState("");
  const [quickMsg,setQuickMsg]=useState(null);

  const saveProducts=p=>{setProducts(p);sset(SK.products,p);};
  const saveLogs=l=>{setLogs(l);sset(SK.logs,l);};
  const saveGoals=g=>{setGoals(g);sset(SK.goals,g);};
  const saveProgCfg=p=>{setProgCfg(p);sset(SK.progress,p);};

  const todayEntries=logs[todayStr()]||[];
  const todayTotals=sumEntries(todayEntries);
  const getBurned=d=>logs[d+"_sport"]||0;
  const saveBurned=kcal=>saveLogs({...logs,[todayStr()+"_sport"]:kcal});

  const addEntry=(product,grams)=>{
    const d=todayStr();
    saveLogs({...logs,[d]:[...(logs[d]||[]),computeNutrition(product,grams)]});
  };

  const handleQuickAdd=()=>{
    const parsed=parseEntry(quickText.trim());
    if(!parsed){setQuickMsg({t:"err",msg:"Gebruik: '200g kipfilet' of '1 bar proteinereep'"});return;}
    const product=findProduct(products,parsed.name);
    if(!product){
      setQuickMsg({t:"warn",msg:`"${parsed.name}" staat nog niet in je bibliotheek.`});
      setAddPrefill(parsed.name);setPendingEntry({parsed});
      setTimeout(()=>setShowAdd(true),600);return;
    }
    const grams=resolveGrams(parsed,product);
    if(grams==null){
      if(parsed.count!=null&&!product.portionGrams){
        setQuickMsg({t:"warn",msg:`"${product.name}" heeft geen portiegrootte ingesteld.`});return;
      }
      setQuickMsg({t:"err",msg:`Eenheid "${parsed.unit}" klopt niet.`});return;
    }
    addEntry(product,grams);
    const label=parsed.grams!=null?`${grams}g`:`${parsed.count} ${parsed.unit} (${grams}g)`;
    setQuickText("");setQuickMsg({t:"ok",msg:`✅ ${label} ${product.name} toegevoegd!`});
    setTimeout(()=>setQuickMsg(null),2500);
  };

  const handleProductSaved=product=>{
    const updated=[...products,product];
    saveProducts(updated);setShowAdd(false);
    if(pendingEntry){
      const grams=resolveGrams(pendingEntry.parsed,product);
      if(grams){addEntry(product,grams);}
      setQuickMsg({t:"ok",msg:`✅ ${product.name} opgeslagen${grams?" en toegevoegd":""}!`});
      setTimeout(()=>setQuickMsg(null),3000);
      setPendingEntry(null);setQuickText("");
    }
  };

  const removeEntry=(date,idx)=>saveLogs({...logs,[date]:logs[date].filter((_,i)=>i!==idx)});

  return(
    <div style={{minHeight:"100vh",background:"#0f172a",color:"#e2e8f0",fontFamily:"system-ui,sans-serif",paddingBottom:80}}>
      {showAdd&&<AddProductModal onClose={()=>{setShowAdd(false);setPendingEntry(null);}} onSaved={handleProductSaved} prefillName={addPrefill}/>}
      <div style={{background:"#1e293b",padding:"14px 18px",display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:22}}>🥗</span>
        <span style={{fontWeight:700,fontSize:18}}>NutriTrack</span>
        <span style={{marginLeft:"auto",fontSize:12,color:"#64748b"}}>{todayStr()}</span>
      </div>
      <div style={{display:"flex",background:"#1e293b",borderBottom:"1px solid #334155",overflowX:"auto"}}>
        {[["dashboard","📊 Vandaag"],["week","📅 Week"],["progress","🏆 Progress"],["library","📚 Bibliotheek"],["goals","🎯 Doelen"]].map(([id,label])=>(
          <button key={id} onClick={()=>setTab(id)} style={{flex:"0 0 auto",padding:"11px 12px",border:"none",background:"none",
            color:tab===id?"#f97316":"#64748b",fontWeight:tab===id?700:400,fontSize:12,cursor:"pointer",
            borderBottom:tab===id?"2px solid #f97316":"2px solid transparent",whiteSpace:"nowrap"}}>{label}</button>
        ))}
      </div>
      <div style={{padding:16,maxWidth:500,margin:"0 auto"}}>
        {tab==="dashboard"&&<Dashboard goals={goals} totals={todayTotals} entries={todayEntries}
          quickText={quickText} setQuickText={setQuickText} quickMsg={quickMsg}
          onQuickAdd={handleQuickAdd} onAddProduct={()=>{setAddPrefill("");setPendingEntry(null);setShowAdd(true);}}
          onRemove={idx=>removeEntry(todayStr(),idx)}
          burnedKcal={getBurned(todayStr())} onSaveBurned={saveBurned}/>}
        {tab==="week"&&<WeekView logs={logs} goals={goals} getBurned={getBurned}/>}
        {tab==="progress"&&<ProgressView logs={logs} progressCfg={progCfg} onChangeCfg={saveProgCfg} getBurned={getBurned}/>}
        {tab==="library"&&<Library products={products}
          onAdd={()=>{setAddPrefill("");setShowAdd(true);}}
          onDelete={id=>saveProducts(products.filter(p=>p.id!==id))}
          onSave={updated=>saveProducts(products.map(p=>p.id===updated.id?updated:p))}/>}
        {tab==="goals"&&(
          <div>
            <BackupRestore onImport={()=>{
              setProducts(sget(SK.products,[]));
              setLogs(sget(SK.logs,{}));
              setGoals(sget(SK.goals,DEF_GOALS));
              setProgCfg(sget(SK.progress,DEF_PROG));
            }}/>
            <Goals goals={goals} onChange={saveGoals}/>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
